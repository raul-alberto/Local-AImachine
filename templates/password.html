<!doctype html>
<html
  lang="en"
  {% if initial_theme and initial_theme != 'crimson' %}data-theme="{{ initial_theme }}"{% endif %}
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Change password - Court</title>
    <link
      rel="icon"
      href="{{ url_for('static', filename='images/bettenLocal.jpg') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body class="auth-body">
    <main class="auth-shell">
      <section class="auth-card">
        <div class="auth-brand">
          <img
            src="{{ url_for('static', filename='images/bettenLocal.jpg') }}"
            alt="Court logo"
            width="44"
            height="44"
          />
          <div>
            <h1>Change password</h1>
            <p>Update the password for {{ username }}</p>
          </div>
        </div>

        <form method="post" class="auth-form">
          <div class="field">
            <label for="current_password">Current password</label>
            <input
              class="input"
              type="password"
              id="current_password"
              name="current_password"
              required
              autocomplete="current-password"
              autofocus
            />
          </div>

          <div class="field">
            <label for="new_password">New password</label>
            <input
              class="input"
              type="password"
              id="new_password"
              name="new_password"
              placeholder="at least 8 characters"
              required
              minlength="8"
              autocomplete="new-password"
            />
          </div>

          <div class="field">
            <label for="confirm_password">Confirm new password</label>
            <input
              class="input"
              type="password"
              id="confirm_password"
              name="confirm_password"
              required
              minlength="8"
              autocomplete="new-password"
            />
          </div>

          <button class="btn btn-primary btn-block" type="submit">
            Update password
          </button>
        </form>

        {% with messages = get_flashed_messages() %} {% if messages %}
        <div class="auth-feedback">{{ messages[0] }}</div>
        {% endif %} {% endwith %}

        <div class="auth-foot">
          <a href="{{ url_for('chat') }}">Back to chat</a>
        </div>
      </section>
    </main>
  </body>
</html>
